[package]
name = "sshc-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Interface do cliente SSH multi-sessao"

[[bin]]
name = "sshc-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = "0.4"
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
reqwest.workspace = true
rfd = "0.17"
serde.workspace = true
sha2.workspace = true
sshc-core = { path = "../core" }
sshc-net = { path = "../net" }
sshc-sync = { path = "../sync" }
sshc-term = { path = "../term" }

# No Linux o eframe precisa escolher o backend de janela explicitamente.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland"] }

[dev-dependencies]
tempfile.workspace = true
